name: Shared UI

# Fails when src/shared/ drifts from the song server's shared/ folder.
# The server repo is private, so this needs a PSA150_SERVER_TOKEN secret: a
# fine-grained token with read access to the contents of nitech/PSA150-server.
# Without the secret the check is skipped with a warning.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SERVER_TOKEN: ${{ secrets.PSA150_SERVER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip without a server token
        if: env.SERVER_TOKEN == ''
        run: echo "::warning::PSA150_SERVER_TOKEN is not set; shared UI check skipped."

      - uses: actions/checkout@v4
        if: env.SERVER_TOKEN != ''
        with:
          repository: nitech/PSA150-server
          token: ${{ env.SERVER_TOKEN }}
          path: server
          sparse-checkout: shared

      - name: Compare src/shared/ with the server
        if: env.SERVER_TOKEN != ''
        run: PSA150_SERVER_DIR=server node scripts/sync-shared.mjs --check
