name: Release

# Every push to main publishes a signed release. Installed apps poll
# releases/latest/download/latest.json, download the new build in the
# background and install it when the operator closes Psalm150.
#
# The version is <major>.<minor> from src-tauri/tauri.conf.json plus the run
# number, so it always goes up. Bump major or minor there by hand.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".wiki/**"
      - "docs/**"
  workflow_dispatch:

# One release at a time, in push order; never cancel a half-built release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
      desktop_api: ${{ steps.version.outputs.desktop_api }}
      server_endpoints: ${{ steps.endpoints.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          base=$(node -p "require('./src-tauri/tauri.conf.json').version.split('.').slice(0, 2).join('.')")
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # The song server contract this build needs (see src-tauri/src/updater.rs).
          api=$(sed -n "s/^pub const REQUIRED_DESKTOP_API: u32 = //p" src-tauri/src/updater.rs | tr -dc '0-9')
          test -n "$api" || { echo "::error::REQUIRED_DESKTOP_API not found"; exit 1; }
          echo "desktop_api=$api" >> "$GITHUB_OUTPUT"

      # Every song server path this build calls. Installed apps connected to a
      # server check it describes each one before taking this release.
      - id: endpoints
        run: |
          list=$(node scripts/server-endpoints.mjs)
          echo "$list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      # praise.otab.no runs the song server from main. A path it lacks is a
      # server change not deployed yet, or a mistake in the client: connected
      # apps will not take this release until their server has it.
      - name: Check the paths on praise.otab.no
        env:
          ENDPOINTS: ${{ steps.endpoints.outputs.list }}
        run: |
          node -e '
            (async () => {
              const doc = await (await fetch("https://praise.otab.no/api/openapi.json")).json();
              const offered = new Set(Object.keys(doc.paths).map((p) => p.replace(/\{[^}]*\}/g, "{}")));
              const missing = JSON.parse(process.env.ENDPOINTS).filter((p) => !offered.has(p));
              for (const path of missing) console.log(`::warning::praise.otab.no does not have ${path}; connected apps will wait for a server that does`);
            })().catch((error) => console.log(`::warning::Could not read praise.otab.no OpenAPI: ${error}`));
          '

      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git log -1 --format=%B > notes.txt
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" \
            -f name="Psalm150 $VERSION" -F body=@notes.txt -F draft=true --jq .id)
          test -n "$id" || { echo "::error::No release id"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: bun install --frozen-lockfile

      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ needs.create.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # Publish only once every platform is uploaded, so latest.json is complete
  # the moment installed apps can see it.
  publish:
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      # Installed apps connected to a song server skip a release that calls a
      # path the server lacks or needs a newer contract than it speaks.
      - name: Record the song server requirements in latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create.outputs.version }}
          DESKTOP_API: ${{ needs.create.outputs.desktop_api }}
          ENDPOINTS: ${{ needs.create.outputs.server_endpoints }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern latest.json
          jq --argjson api "$DESKTOP_API" --argjson endpoints "$ENDPOINTS"             '. + {desktop_api: $api, server_endpoints: $endpoints}' latest.json > stamped.json
          mv stamped.json latest.json
          gh release upload "v$VERSION" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # A failed build leaves a draft nobody can see; remove it.
  cleanup:
    needs: [create, build]
    if: failure() && needs.create.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.create.outputs.version }}
        run: gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes
