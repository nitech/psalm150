<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: radial-gradient(900px 520px at 78% 62%, rgb(230 184 96 / 0.16), transparent 60%),
                linear-gradient(180deg, #161616 0%, #060606 100%);
    font-family: "Geist", system-ui, sans-serif; color: #f4f1ea; }
  .copy { position: absolute; left: 88px; top: 0; bottom: 0; width: 560px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand svg { width: 124px; height: 124px; flex: none; filter: drop-shadow(0 18px 40px rgb(0 0 0 / 0.55)); }
  .brand h1 { margin: 0; font-size: 92px; font-weight: 600; letter-spacing: -0.035em; line-height: 1; }
  .tagline { margin: 40px 0 0; font-size: 36px; line-height: 1.3; color: #b9b4aa; font-weight: 400; letter-spacing: -0.01em; max-width: 520px; }
  .tagline strong { color: #e6b860; font-weight: 500; }
  .phone { position: absolute; left: 752px; top: 64px; width: 360px; height: 780px; border-radius: 54px; padding: 12px;
    background: linear-gradient(160deg, #3a3a3a, #1b1b1b 40%, #0e0e0e); box-shadow: 0 40px 90px rgb(0 0 0 / 0.65), inset 0 0 0 1.5px rgb(255 255 255 / 0.12); }
  .phone .screen { width: 100%; height: 100%; border-radius: 43px; overflow: hidden; background: #000; }
  .phone img { width: 100%; display: block; margin-top: 46px; }
  .phone .island { position: absolute; top: 26px; left: 50%; width: 104px; height: 30px; margin-left: -52px; border-radius: 16px; background: #000; }
</style></head>
<body>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262626"/><stop offset="1" stop-color="#0a0a0a"/></linearGradient></defs>
        <rect width="1024" height="1024" rx="228" fill="url(#tile)"/>
        <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="12"/>
        <path transform="translate(40 -30)" d="M200 700 H560 A180 180 0 0 0 740 520 A180 180 0 0 0 560 340 A129.6 129.6 0 0 0 430.4 469.6 A86.4 86.4 0 0 0 516.8 556 A48.6 48.6 0 0 0 565.4 507.4" fill="none" stroke="#e6b860" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Psalm150</h1>
    </div>
    <p class="tagline">Your church's <strong>songs and sets</strong>, on any device.</p>
  </div>
  <div class="phone"><div class="screen"><img src="../../site/public/shots/phone.webp" alt=""></div><div class="island"></div></div>
</body></html>
