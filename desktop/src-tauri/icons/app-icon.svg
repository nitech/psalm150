<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Source for every generated app icon: `bun run tauri icon src-tauri/icons/app-icon.svg`.
       A cross with song rising from it: worship in song. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcebaa"/>
      <stop offset="0.55" stop-color="#c6d88c"/>
      <stop offset="1" stop-color="#8fa653"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#shine)"/>
  <g fill="#1a1a1a">
    <!-- cross -->
    <rect x="352" y="196" width="104" height="632" rx="24"/>
    <rect x="228" y="340" width="352" height="100" rx="24"/>
    <!-- beamed notes rising to the right of the cross -->
    <ellipse cx="626" cy="742" rx="66" ry="52" transform="rotate(-22 626 742)"/>
    <ellipse cx="800" cy="676" rx="66" ry="52" transform="rotate(-22 800 676)"/>
    <rect x="662" y="498" width="34" height="240"/>
    <rect x="836" y="432" width="34" height="240"/>
    <path d="M662 498 L870 432 L870 512 L662 578 Z"/>
  </g>
</svg>
