[package]
name = "visual-song-book"
version = "0.1.0"
description = "Visual Song Book — cross-platform worship song projection"
authors = ["Sevenfold"]
edition = "2021"

[lib]
name = "visual_song_book_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
jetdb = "0.3"
notify = "7"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
slug = "0.1"
parking_lot = "0.12"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "mdb_import"
path = "tests/mdb_import.rs"
